# VirtualHost pro sistema Pontual Logística
# 2 ambientes: PROD (raiz) e HOMOL (/homol/*)

<VirtualHost *:80>
    ServerName logistica.pontualpetroleo.com.br
    ServerAlias srv1464919.hstgr.cloud

    DocumentRoot /var/pontual/frontend

    # ═══════════════════════════════════════════════════════════
    # HOMOLOGAÇÃO — /homol/*
    # ═══════════════════════════════════════════════════════════
    Alias /homol/api /var/pontual-homol/backend
    Alias /homol/uploads /var/pontual-homol/uploads
    Alias /homol /var/pontual-homol/frontend

    # Backend homol via proxy porta 3001
    ProxyPass        /homol/api/     http://127.0.0.1:3001/api/
    ProxyPassReverse /homol/api/     http://127.0.0.1:3001/api/
    ProxyPass        /homol/health   http://127.0.0.1:3001/health
    ProxyPassReverse /homol/health   http://127.0.0.1:3001/health
    ProxyPass        /homol/uploads/ http://127.0.0.1:3001/uploads/
    ProxyPassReverse /homol/uploads/ http://127.0.0.1:3001/uploads/

    <Directory /var/pontual-homol/frontend>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        FallbackResource /homol/index.html
    </Directory>

    # ═══════════════════════════════════════════════════════════
    # PRODUÇÃO — raiz /
    # ═══════════════════════════════════════════════════════════
    ProxyPreserveHost On
    ProxyPass        /api/     http://127.0.0.1:3000/api/
    ProxyPassReverse /api/     http://127.0.0.1:3000/api/
    ProxyPass        /health   http://127.0.0.1:3000/health
    ProxyPassReverse /health   http://127.0.0.1:3000/health
    ProxyPass        /uploads/ http://127.0.0.1:3000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/

    <Directory /var/pontual/frontend>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        FallbackResource /index.html
    </Directory>

    # /assets/* NUNCA cai no fallback (proteção)
    <LocationMatch "^/assets/">
        FallbackResource disabled
    </LocationMatch>
    <LocationMatch "^/homol/assets/">
        FallbackResource disabled
    </LocationMatch>

    # MIME types corretos
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        <FilesMatch "\.(js|mjs)$">
            Header set Content-Type "application/javascript; charset=utf-8"
        </FilesMatch>
        <FilesMatch "\.css$">
            Header set Content-Type "text/css; charset=utf-8"
        </FilesMatch>
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/pontual_error.log
    CustomLog ${APACHE_LOG_DIR}/pontual_access.log combined
</VirtualHost>
