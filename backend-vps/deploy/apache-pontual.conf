# VirtualHost pro sistema Pontual Logística
# Apache faz proxy reverso pra backend Node na porta 3000 (interna)
# e serve arquivos estáticos do frontend em /var/pontual/frontend

<VirtualHost *:80>
    ServerName logistica.pontualpetroleo.com.br
    ServerAlias srv1464919.hstgr.cloud

    DocumentRoot /var/pontual/frontend

    # Proxy pra backend Node (API + uploads) — ANTES do fallback pra ter prioridade
    ProxyPreserveHost On
    ProxyPass        /api/     http://127.0.0.1:3000/api/
    ProxyPassReverse /api/     http://127.0.0.1:3000/api/
    ProxyPass        /health   http://127.0.0.1:3000/health
    ProxyPassReverse /health   http://127.0.0.1:3000/health
    ProxyPass        /uploads/ http://127.0.0.1:3000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/

    <Directory /var/pontual/frontend>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        # SPA fallback: qualquer rota que não seja arquivo existente devolve index.html
        # FallbackResource é mais confiável que RewriteRule pra SPA
        FallbackResource /index.html
    </Directory>

    # /assets/* NUNCA cai no fallback — sempre servido como arquivo estático
    # (proteção extra caso FallbackResource resolva errado)
    <LocationMatch "^/assets/">
        FallbackResource disabled
    </LocationMatch>

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"

        # MIME types corretos pra assets (fix pra module scripts)
        <FilesMatch "\.js$">
            Header set Content-Type "application/javascript; charset=utf-8"
        </FilesMatch>
        <FilesMatch "\.mjs$">
            Header set Content-Type "application/javascript; charset=utf-8"
        </FilesMatch>
        <FilesMatch "\.css$">
            Header set Content-Type "text/css; charset=utf-8"
        </FilesMatch>
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/pontual_error.log
    CustomLog ${APACHE_LOG_DIR}/pontual_access.log combined
</VirtualHost>
