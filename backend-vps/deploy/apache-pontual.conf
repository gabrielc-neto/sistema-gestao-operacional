# VirtualHost pro sistema Pontual Logística
# Apache faz proxy reverso pra backend Node na porta 3000 (interna)
# e serve arquivos estáticos do frontend em /var/pontual/frontend
#
# Antes de habilitar: sudo a2enmod proxy proxy_http headers rewrite
# Ativar site: sudo a2ensite pontual-logistica && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName logistica.pontualpetroleo.com.br
    ServerAlias srv1464919.hstgr.cloud

    # Frontend estático
    DocumentRoot /var/pontual/frontend
    <Directory /var/pontual/frontend>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # Proxy pra backend Node (API + uploads) — ANTES do rewrite pra ter prioridade
    ProxyPreserveHost On
    ProxyPass        /api/     http://127.0.0.1:3000/api/
    ProxyPassReverse /api/     http://127.0.0.1:3000/api/
    ProxyPass        /health   http://127.0.0.1:3000/health
    ProxyPassReverse /health   http://127.0.0.1:3000/health
    ProxyPass        /uploads/ http://127.0.0.1:3000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/

    # SPA fallback — qualquer rota não-arquivo devolve index.html (só depois do proxy)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_URI} !^/uploads
        RewriteCond %{REQUEST_URI} !^/health
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </IfModule>

    # Cabeçalhos
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Logs
    ErrorLog  ${APACHE_LOG_DIR}/pontual_error.log
    CustomLog ${APACHE_LOG_DIR}/pontual_access.log combined
</VirtualHost>
