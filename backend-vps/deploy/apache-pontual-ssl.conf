# VirtualHost HTTPS pro sistema Pontual — cobre srv1464919.hstgr.cloud
# Usa certificado self-signed temporário (Ubuntu snakeoil).
# Substituir por Let's Encrypt quando dominio logistica.pontualpetroleo.com.br
# apontar pra este IP.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName srv1464919.hstgr.cloud
    ServerAlias logistica.pontualpetroleo.com.br

    DocumentRoot /var/pontual/frontend
    <Directory /var/pontual/frontend>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # Proxy pro backend Node
    ProxyPreserveHost On
    ProxyPass        /api/     http://127.0.0.1:3000/api/
    ProxyPassReverse /api/     http://127.0.0.1:3000/api/
    ProxyPass        /health   http://127.0.0.1:3000/health
    ProxyPassReverse /health   http://127.0.0.1:3000/health
    ProxyPass        /uploads/ http://127.0.0.1:3000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/

    # SPA fallback
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_URI} !^/uploads
        RewriteCond %{REQUEST_URI} !^/health
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </IfModule>

    # SSL (self-signed temporário — Ubuntu default snakeoil)
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    ErrorLog  ${APACHE_LOG_DIR}/pontual_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/pontual_ssl_access.log combined
</VirtualHost>
</IfModule>
