# VirtualHost pro ambiente HOMOLOG (pontualpetroleo.tech)
# Mesmo VPS do prod, backend em porta 3001, banco pontual_homolog,
# frontend em /var/pontual-homolog/frontend, uploads em /var/pontual-homolog/uploads.
#
# HTTP → redireciona pra HTTPS (Let's Encrypt via certbot depois do DNS apontar)

<VirtualHost *:80>
    ServerName pontualpetroleo.tech
    ServerAlias www.pontualpetroleo.tech

    # ACME challenge do certbot (Let's Encrypt) fica acessivel via HTTP
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pontualpetroleo.tech
    ServerAlias www.pontualpetroleo.tech

    DocumentRoot /var/pontual-homolog/frontend
    <Directory /var/pontual-homolog/frontend>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>

    # Proxy pro backend Node (porta 3001 — separada do prod que roda em 3000)
    ProxyPreserveHost On
    ProxyPass        /api/     http://127.0.0.1:3001/api/
    ProxyPassReverse /api/     http://127.0.0.1:3001/api/
    ProxyPass        /health   http://127.0.0.1:3001/health
    ProxyPassReverse /health   http://127.0.0.1:3001/health
    ProxyPass        /uploads/ http://127.0.0.1:3001/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/

    # SPA fallback (React Router)
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api
        RewriteCond %{REQUEST_URI} !^/uploads
        RewriteCond %{REQUEST_URI} !^/health
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </IfModule>

    # SSL (self-signed inicial — trocar por Let's Encrypt apos DNS propagar)
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    # Banner visivel pra deixar claro que e ambiente de teste
    Header always set X-Environment "HOMOLOG"

    ErrorLog  ${APACHE_LOG_DIR}/pontual_homolog_error.log
    CustomLog ${APACHE_LOG_DIR}/pontual_homolog_access.log combined
</VirtualHost>
</IfModule>
